<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maker Room - Cadastro de Produtos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='cadastro_produtos.css') }}">
</head>
<body>
    <div class="layout">
        <main class="content">
            <div class="content-header">
                <div class="search-wrapper">
                    <span>🔍</span>
                    <input type="search" placeholder="Pesquisar Produto...">
                </div>
                <div class="profile">
                    <img src="https://via.placeholder.com/150/0d38a0/ffffff?text=R" alt="Avatar">
                    <div class="profile-name">Renatão Silva</div>
                </div>
            </div>

            <section class="card">
                <div class="card-top">
                    <h1 class="card-title">Cadastro de Produtos</h1>
                </div>

                <form class="form-container">
                    <div class="form-group">
                        <label for="nome">Nome do Produto</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite o nome do produto" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="especificacao">Especificação</label>
                            <input type="text" id="especificacao" name="especificacao" placeholder="Ex: TI, Eletrônicos">
                        </div>
                        <div class="form-group">
                            <label for="quantidade">Quantidade</label>
                            <input type="number" id="quantidade" name="quantidade" placeholder="Digite a quantidade" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="categoria">Categoria</label>
                            <select id="categoria" name="categoria" required>
                                <option value="">Selecione uma categoria</option>
                                <option value="manutencao">Manutenção</option>
                                <option value="informatica">Informática</option>
                                <option value="ferramentas">Ferramentas</option>
                                <option value="eletronico">Eletrônico</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="marca">Marca</label>
                            <input type="text" id="marca" name="marca" placeholder="Digite a marca">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status" name="status" required>
                            <option value="ativo">Ativo</option>
                            <option value="inativo">Inativo</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="descricao">Descrição</label>
                        <textarea id="descricao" name="descricao" placeholder="Digite a descrição do produto" rows="4"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-salvar">✓ Salvar</button>
                        <button type="reset" class="btn-cancelar">✕ Cancelar</button>
                    </div>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
