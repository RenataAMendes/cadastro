{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='perfil.css') }}">
<script>
document.addEventListener('DOMContentLoaded', function() {
    const homeItem = document.querySelector('aside .menu li.selecionado');
    if (homeItem) homeItem.classList.remove('selecionado');

    const menuItems = document.querySelectorAll('aside .menu li');
    menuItems.forEach(item => {
        if (item.textContent.trim().toUpperCase() === 'PERFÍL') {
            item.classList.add('selecionado');
        }
    });
});
</script>
{% endblock %}

{% block content %}

    <div class="container">

        <h1>Perfil</h1>

        <div class="perfil-content">

            <div class="dados">
                <p><strong>NOME:</strong> CARA COM NOME FICTÍCIO</p>
                <p><strong>EMAIL:</strong> CARA-COM-NOME-FICTÍCIO@GMAIL.COM</p>
                <p><strong>MATRÍCULA:</strong> 1</p>
                <p><strong>FUNÇÃO:</strong> PCD</p>

                <div class="botoes">
                    <button class="btn-azul">EDITAR</button>
                    <button class="btn-azul">ALTERAR SENHA</button>
                </div>

                <div class="logout">
                    <button class="btn-vermelho">SAIR</button>
                </div>
            </div>

        </div>

    </div>
{% endblock %}
