<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maker Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            display: flex;
            min-height: 100vh;
            background-color: #000000;
            color: #ffffff;
            overflow-x: hidden;
        }

        .sidebar {
            width: 260px;
            background-color: #1239c4;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 0;
            flex-shrink: 0;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-top {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            font-weight: 800;
            font-size: 24px;
            color: #ffffff;
            text-align: center;
            line-height: 1.1;
            margin-bottom: 50px;
            letter-spacing: 1px;
        }

        .logo span {
            display: block;
            font-weight: 400;
            font-size: 20px;
        }

        .nav-menu {
            width: 100%;
            list-style: none;
        }

        .nav-item {
            width: 100%;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Estilo para o item ativo (Home) */
        .nav-item.active {
            background-color: #1640d6; /* Um azul ligeiramente diferente para destaque */
        }

        .nav-link {
            display: block;
            padding: 20px 0;
            text-align: center;
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1px;
            transition: background-color 0.2s ease;
        }

        .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .btn-sair {
            width: 80%;
            background-color: #ffffff;
            color: #1239c4;
            border: none;
            border-radius: 25px;
            padding: 12px 0;
            font-weight: 700;
            font-size: 16px;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn-sair:hover {
            background-color: #f0f0f0;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #000000;
        }

        .content {
            flex: 1;
            padding: 40px;
            z-index: 1;
        }

        .footer-accent {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 50%;
            height: 120px;
            background-color: #072183;
            clip-path: polygon(30% 100%, 100% 100%, 100% 0);
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Barra Lateral Azul -->
    <aside class="sidebar">
        <div class="sidebar-top">
            <div class="logo">
                MAKER
                <span>ROOM</span>
            </div>
            
            <nav class="nav-menu">
                <ul>
                    <li class="nav-item active">
                        <a href="#" class="nav-link">HOME</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">PRODUTOS</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">CATEGORIAS</a>
                    </li>
                </ul>
            </nav>
        </div>

        <a href="/logout" class="btn-sair">SAIR</a>
    </aside>

    <!-- Área de Conteúdo -->
    <main class="main-container">
        <div class="content">
            {% block content %}
            {% endblock %}
        </div>
        
        <div class="footer-accent"></div>
    </main>

</body>
</html>
