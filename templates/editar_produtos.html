{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='editar_produtos.css') }}">
<script>
document.addEventListener('DOMContentLoaded', function() {
    const homeItem = document.querySelector('aside .menu li.selecionado');
    if (homeItem) homeItem.classList.remove('selecionado');

    const menuItems = document.querySelectorAll('aside .menu li');
    menuItems.forEach(item => {
        if (item.textContent.trim().toUpperCase() === 'PRODUTOS') {
            item.classList.add('selecionado');
        }
    });
});
</script>
{% endblock %}

{% block content %}
    <div class="content-header">
        <div class="search-wrapper">
            <span>🔍</span>
            <input type="search" placeholder="Pesquisar Produto...">
        </div>
        <div class="profile">
            <img src="https://via.placeholder.com/150/0d38a0/ffffff?text=R" alt="Avatar">
            <div class="profile-name">Renatão Silva</div>
        </div>
    </div>

    <section class="card">
                <div class="card-top">
                    <h1 class="card-title">Editar Produto</h1>
                </div>

                <form class="form-container">
                    <div class="form-group">
                        <label for="id">ID do Produto</label>
                        <input type="text" id="id" name="id" value="01" disabled>
                    </div>

                    <div class="form-group">
                        <label for="nome">Nome do Produto</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite o nome do produto" value="Dell Latitude" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="quantidade">Quantidade</label>
                            <input type="number" id="quantidade" name="quantidade" placeholder="Digite a quantidade" value="30" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="categoria">Categoria</label>
                            <select id="categoria" name="categoria" required>
                                <option value="">Selecione uma categoria</option>
                                <option value="manutencao" selected>Manutenção</option>
                                <option value="informatica">Informática</option>
                                <option value="ferramentas">Ferramentas</option>
                                <option value="eletronico">Eletrônico</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="marca">Marca</label>
                            <input type="text" id="marca" name="marca" placeholder="Digite a marca" value="Ex">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status" name="status" required>
                            <option value="ativo" selected>Ativo</option>
                            <option value="inativo">Inativo</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="descricao">Descrição</label>
                        <textarea id="descricao" name="descricao" placeholder="Digite a descrição do produto" rows="4">Notebook Dell Latitude com processador Intel</textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-salvar">✓ Salvar Alterações</button>
                        <a href="{{ url_for('produtos') }}" class="btn-cancelar">← Voltar</a>
                        <button type="reset" class="btn-cancelar">✕ Cancelar</button>
                    </div>
                </form>
            </section>
{% endblock %}
