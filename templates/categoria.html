<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Maker Room - Categorias</title>

<style>

:root{
    --bg-body:#09090b;
    --bg-card:#313d8b;
    --bg-input:#4452b8;
    --white:#fff;
    --green:#22c55e;
    --red:#ef4444;
    --blue:#3b82f6;
    --orange:#f97316;
    --gray:#374151;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:var(--bg-body);
    color:var(--white);
    padding:30px;
}

/* CONTAINER */

.container{
    max-width:1200px;
    margin:auto;
}

/* TOPO */

.top-bar{
    display: flex;
    justify-content: center; /* centraliza tudo */
    align-items: center;
    margin-bottom: 35px;
    position: relative; /* importante para o user ficar no canto */
}

.left-top{
    display:flex;
    align-items:center;
    gap:20px;
}


.search-container{
    position:relative;
}

.search-container input{
    width:320px;
    background:black;
    border:2px solid white;
    border-radius:50px;
    padding:12px 45px 12px 20px;
    color:white;
    outline:none;
}

.search-icon{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    font-size:16px;
}
.user-profile{
    position: fixed;
    top: 15px;
    right: 20px;

    display: flex;
    align-items: center;
    gap: 10px;

    background: rgba(49, 61, 139, 0.6);
    padding: 8px 12px;
    border-radius: 50px;

    backdrop-filter: blur(10px);
    z-index: 9999;
}
.user-avatar{
    width:36px;
    height:36px;
    border-radius:50%;
    background:#dbeafe;
}

/* CARD */

.card-panel{
    background:var(--bg-card);
    border-radius:20px;
    padding:25px;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.panel-header h2{
    font-size:48px;
    font-weight:700;
}

.btn-new{
    width:55px;
    height:55px;
    border:none;
    border-radius:50%;
    background:var(--green);
    color:white;
    font-size:30px;
    cursor:pointer;
    transition:.3s;
}

.btn-new:hover{
    transform:scale(1.08);
}

/* TABELA */

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:18px 15px;
    text-align:left;
}

th{
    font-size:.85rem;
    color:rgba(255,255,255,.7);
    text-transform:uppercase;
}

tbody tr{
    border-top:1px solid rgba(255,255,255,.08);
}

tbody tr:last-child{
    border-bottom:1px solid rgba(255,255,255,.08);
}

.status-badge{
    background:var(--green);
    padding:5px 14px;
    border-radius:50px;
    font-size:.8rem;
    font-weight:bold;
}

.status-badge.inativo{
    background:var(--red);
}

.actions-cell{
    display:flex;
    gap:10px;
}

.btn-action{
    border:none;
    color:white;
    padding:8px 15px;
    border-radius:6px;
    cursor:pointer;
    font-weight:600;
}

.btn-edit{
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    border: none;
    color: white;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
    font-weight: 600;
}

.btn-edit:hover{
    transform: scale(1.05);
    box-shadow: 0 0 10px rgba(59,130,246,0.5);
}
.btn-disable{
    background:var(--red);
}

/* MODAL */

.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:0;
    pointer-events:none;
    transition:.3s;
}

.modal-overlay.active{
    opacity:1;
    pointer-events:auto;
}

.modal-card{
    width:600px;
    background:var(--bg-card);
    border-radius:24px;
    padding:30px;
}

.modal-header{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:25px;
}

.btn-back-modal{
    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    background:#1f2937;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.modal-title{
    font-size:22px;
    font-weight:bold;
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
}

.form-group input,
.form-group textarea{
    width:100%;
    background:var(--bg-input);
    border:none;
    color:white;
    outline:none;
    padding:14px 20px;
}

.form-group input{
    border-radius:50px;
}

.form-group textarea{
    border-radius:18px;
    resize:none;
}

.form-actions{
    display:flex;
    gap:12px;
    margin-top:20px;
}

.btn-submit,
.btn-cancel{
    border:none;
    color:white;
    font-weight:bold;
    padding:12px 22px;
    border-radius:50px;
    cursor:pointer;
}

.btn-submit{
    background:var(--green);
}

.btn-cancel{
    background:var(--orange);
}

@media(max-width:768px){

    .top-bar{
        flex-direction:column;
        gap:20px;
    }

    .left-top{
        width:100%;
        flex-direction:column;
    }

    .search-container input{
        width:100%;
    }

    .modal-card{
        width:95%;
    }

    .actions-cell{
        flex-direction:column;
    }
}

</style>
</head>

<body>





    <div class="top-bar">

        <div class="search-container">
            <input
                type="text"
                id="pesquisaCategoria"
                placeholder="Pesquisar Categoria..."
            >
            <span class="search-icon">🔍</span>
        
        <div class="user-profile">
            <div class="user-avatar"></div>
            <span>Renatão Silva</span>
        </div>
    
    </div>

        </div>

 

    </div>

    <div class="card-panel">

        <div class="panel-header">

            <h2>Categorias</h2>

            <button
                class="btn-new"
                id="btnAbrirModal">
                +
            </button>

        </div>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="tabelaCategoriasCorpo">

                <tr>

                    <td>01</td>

                    <td>Eletrônicos</td>

                    <td>Dispositivos e hardware</td>

                    <td>
                        <span class="status-badge">
                            Ativo
                        </span>
                    </td>

                    <td class="actions-cell">
                        <button class="btn-action btn-edit" onclick="editarCategoria(this)">
                            Editar
                        </button>
                        <button
                            class="btn-action btn-disable"
                            onclick="alternarStatus(this)">
                            Desativar
                        </button>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

<!-- MODAL -->

<div
class="modal-overlay"
id="modalNovaCategoria">

    <div class="modal-card">

        <div class="modal-header">

            <button
                class="btn-back-modal"
                id="btnFecharModal">
                ←
            </button>

            <div class="modal-title">
                Nova Categoria
            </div>

        </div>

        <form id="formCadastroCategoria">

            <div class="form-group">

                <label>
                    Nome da Categoria
                </label>

                <input
                    type="text"
                    id="nomeCategoria"
                    required>

            </div>

            <div class="form-group">

                <label>
                    Descrição
                </label>

                <textarea
                    id="descricaoCategoria"
                    rows="4"
                    required>
                </textarea>

            </div>

            <div class="form-actions">

                <button
                    type="submit"
                    class="btn-submit">
                    ✔ Salvar
                </button>

                <button
                    type="button"
                    class="btn-cancel"
                    id="btnCancelar">
                    ✖ Cancelar
                </button>

            </div>

        </form>

    </div>

</div>

<script>

/* MODAL */

const modal =
document.getElementById(
"modalNovaCategoria"
);

document
.getElementById("btnAbrirModal")
.addEventListener("click",()=>{

    modal.classList.add("active");

});

function fecharModal(){

    modal.classList.remove("active");

}

document
.getElementById("btnFecharModal")
.addEventListener("click",fecharModal);

document
.getElementById("btnCancelar")
.addEventListener("click",fecharModal);

/* CADASTRAR */

document
.getElementById("formCadastroCategoria")
.addEventListener("submit",function(e){

    e.preventDefault();

    const nome =
    document.getElementById(
    "nomeCategoria"
    ).value;

    const descricao =
    document.getElementById(
    "descricaoCategoria"
    ).value;

    const tabela =
    document.getElementById(
    "tabelaCategoriasCorpo"
    );

    const id =
    String(tabela.rows.length + 1)
    .padStart(2,"0");

    tabela.innerHTML += `
    <tr>
        <td>${id}</td>
        <td>${nome}</td>
        <td>${descricao}</td>

        <td>
            <span class="status-badge">
                Ativo
            </span>
        </td>

        <td class="actions-cell">

            <button
                class="btn-action btn-edit"
                onclick="editarCategoria(this)">
                Editar
            </button>

          <button class="btn-disable-modern" onclick="alternarStatus(this)">
    ⛔ Desativar
</button>

        </td>

    </tr>
    `;

    this.reset();

    fecharModal();

});

/* EDITAR */

function editarCategoria(botao){

    const linha =
    botao.closest("tr");

    const nomeAtual =
    linha.cells[1].innerText;

    const descricaoAtual =
    linha.cells[2].innerText;

    const novoNome =
    prompt(
        "Editar nome:",
        nomeAtual
    );

    if(novoNome === null) return;

    const novaDescricao =
    prompt(
        "Editar descrição:",
        descricaoAtual
    );

    if(novaDescricao === null) return;

    linha.cells[1].innerText =
    novoNome;

    linha.cells[2].innerText =
    novaDescricao;
}


/* ATIVAR / DESATIVAR */

function alternarStatus(botao){

    const badge =
    botao
    .closest("tr")
    .querySelector(".status-badge");

    if(
        badge.innerText.trim()
        === "Ativo"
    ){

        badge.innerText =
        "Inativo";

        badge.classList.add(
        "inativo"
        );

        botao.innerText =
        "Ativar";

        botao.style.background =
        "#22c55e";

    }else{

        badge.innerText =
        "Ativo";

        badge.classList.remove(
        "inativo"
        );

        botao.innerText =
        "Desativar";

        botao.style.background =
        "#ef4444";
    }
}



/* PESQUISA */

document
.getElementById(
"pesquisaCategoria"
)
.addEventListener(
"keyup",
function(){

const filtro =
this.value.toLowerCase();

const linhas =
document.querySelectorAll(
"#tabelaCategoriasCorpo tr"
);

linhas.forEach(linha=>{

const nome =
linha.cells[1]
.innerText
.toLowerCase();

linha.style.display =
nome.includes(filtro)
? ""
: "none";

});

});

</script>

</body>
</html>
